spring.application.name=mecanica

spring.datasource.url=jdbc:postgresql://localhost:5432/mecanica
spring.datasource.username=mecanica
spring.datasource.password=mecanica
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=${JWT_SECRET:2hub0pa0lzMheKg7yF_yfQa-4O2Zrj8vsFb1-K9aqsxzcvY9U56cmxER2KveU9B5}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configurações de E-mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}

# Dados do Remetente e URL base para links nos e-mails
app.mail.from=${APP_MAIL_FROM:noreply@mecanica.com}
app.base-url=${APP_BASE_URL:http://localhost:8080}