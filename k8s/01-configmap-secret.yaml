apiVersion: v1
kind: Namespace
metadata:
  name: mecanica
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mecanica-config
  namespace: mecanica
  labels:
    app.kubernetes.io/name: mecanica
    app.kubernetes.io/part-of: oficina-mecanica
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/mecanica"
  SPRING_DATASOURCE_USERNAME: "mecanica"
  APP_BASE_URL: "http://localhost:8080"
  APP_MAIL_FROM: "notificacoes@mecanica.com"
  SPRING_MAIL_HOST: "mailpit-service"
  SPRING_MAIL_PORT: "1025"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
  JWT_EXPIRATION: "86400000"
