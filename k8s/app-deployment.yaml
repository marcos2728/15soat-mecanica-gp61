apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecanica-app
  namespace: mecanica
  labels:
    app: mecanica-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecanica-app
  template:
    metadata:
      labels:
        app: mecanica-app
    spec:
      containers:
        - name: app
          image: mecanica-app:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: mecanica-email-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/mecanica"
            - name: SPRING_DATASOURCE_USERNAME
              value: "mecanica"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mecanica-db-secret
                  key: POSTGRES_PASSWORD
            - name: APP_BASE_URL
              value: "http://mecanica.empresa.com"
