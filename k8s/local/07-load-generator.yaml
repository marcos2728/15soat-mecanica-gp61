apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: mecanica
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load-generator
          image: busybox:1.28
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Disparando carga leve contra mecanica-app..."
              while true; do
                wget -q -O- http://mecanica-app-service.mecanica.svc.cluster.local:8080/v3/api-docs > /dev/null
                sleep 0.05
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
